server:
  grpc_port: 50051
  http_port: 8080
  ingest_enabled: true

ingestor:
  buffer_size: 1000

worker:
  num_workers: 5
  batch_size: 100
  batch_timeout: "5s"

sinks:
  active: ["log", "kafka"]
  kafka:
    brokers: ["localhost:9092"]
    topic: "events"
  http:
    url: "https://webhook.example.com/events"
    timeout: "5s"