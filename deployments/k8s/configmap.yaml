apiVersion: v1
kind: ConfigMap
metadata:
  name: ingestor-config
  labels:
    app: ingestor
data:
  config.yaml: |
    server:
      grpc_port: 50051
      http_port: 8080
      ingest_enabled: true

    ingestor:
      buffer_size: 1000

    worker:
      num_workers: 5
      batch_size: 100
      batch_timeout: "5s"

    sinks:
      active: ["log"]
      kafka:
        brokers: ["kafka:9092"]
        topic: "events"

    dlq:
      enabled: true
      type: "file"
      file:
        dir: "data/dlq"

    logging:
      level: "info"
      format: "json"

    shutdown:
      timeout: "30s"
