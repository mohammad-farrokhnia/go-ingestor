apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: go-ingestor
  labels:
    app: go-ingestor
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: go-ingestor
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
