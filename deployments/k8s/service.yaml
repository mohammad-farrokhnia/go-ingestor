apiVersion: v1
kind: Service
metadata:
  name: ingestor
  labels:
    app: ingestor
spec:
  type: ClusterIP
  selector:
    app: ingestor
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
