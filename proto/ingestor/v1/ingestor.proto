syntax = "proto3";

package ingestor.v1;

option go_package = "github.com/mohammad-farrokhnia/ingestor/proto/ingestor/v1";

service IngestorService {
  rpc Ingest (IngestRequest) returns (IngestResponse);
}

message IngestRequest {
  string event_id = 1;
  string source = 2;
  string payload = 3;
  int64 timestamp = 4;
  string tenant_id = 5;
}

message IngestResponse {
  string status = 1;        // machine-readable outcome: OK, ERROR, DISABLED, DROPPED
  string error = 2;         // legacy English error detail (empty on success)
  string message_code = 3;  // stable i18n code, e.g. ACCEPTED, MISSING_TENANT_ID
  string message = 4;       // localized human-readable message
  string lang = 5;          // language the message was localized to (en, fa)
}